site_name: PolaRoam
site_description: Stays, trajectories, transport mode and home/work locations from mobility pings, with Polars. Incremental, on CPU or CUDA.
site_url: https://ollin18.github.io/polaroam/
repo_url: https://github.com/ollin18/polaroam
repo_name: ollin18/polaroam
edit_uri: edit/main/docs/
copyright: MIT license · Basemaps © Esri, HERE, Garmin, © OpenStreetMap contributors

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            merge_init_into_class: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            filters: ["!^_"]

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quickstart.md
  - User guide:
      - guide/index.md
      - The pipeline: guide/pipeline.md
      - Stays: guide/stays.md
      - Clustering (DBSCAN): guide/clustering.md
      - Local time: guide/local-time.md
      - Home and work: guide/home-work.md
      - Trajectories: guide/trajectories.md
      - Speed and transport mode: guide/speed-and-mode.md
      - Heat maps (H3) and data quality: guide/spatial.md
      - Incremental processing: guide/incremental.md
      - CUDA: guide/cuda.md
      - Scaling and memory: guide/scaling.md
      - Command line: guide/cli.md
      - Configuration: guide/configuration.md
      - Output tables: guide/outputs.md
  - Examples:
      - examples/index.md
      - Example data, end to end: examples/example-data.md
      - Mexico City at scale: examples/mexico-city.md
  - Validation:
      - validation/index.md
      - Parity with gc-lbs: validation/parity.md
      - Benchmarks: validation/benchmarks.md
      - Test suite: validation/testing.md
  - API reference:
      - reference/index.md
      - Pipeline: reference/pipeline.md
      - Stays: reference/stops.md
      - Clustering: reference/clustering.md
      - Trajectories: reference/trajectories.md
      - Local time: reference/local_time.md
      - Home and work: reference/home_work.md
      - H3 aggregation: reference/h3.md
      - Data quality: reference/quality.md
      - Configuration: reference/config.md
      - Input and sharding: reference/io.md
      - Engine (CUDA): reference/engine.md
      - Geometry helpers: reference/geo.md
  - About: about.md
