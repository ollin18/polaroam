[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polaroam"
version = "0.3.0"
description = "Stay detection, trajectories and home/work locations from mobility pings with Polars (incremental, CPU or CUDA)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ollin Langle" }]
requires-python = ">=3.10"
dependencies = ["polars>=1.35", "numpy"]

[project.optional-dependencies]
# GPU engine: cudf-polars >= 26.4 runs every polaroam query on the GPU (shift, windows, ranks)
cuda = ["cudf-polars-cu12>=26.4"]
cuda13 = ["cudf-polars-cu13>=26.4"]
tz = ["shapely>=2.1"]
h3 = ["polars-h3>=0.7"]
# map matching: snap trajectories to a road network (osmnx only to download OpenStreetMap)
roads = ["shapely>=2.1", "numba>=0.59"]
plot = ["matplotlib", "contextily", "datashader"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "mkdocs-glightbox>=0.4"]
dev = ["pytest>=8", "scikit-learn", "scipy", "shapely>=2.1", "polars-h3>=0.7", "numba>=0.59", "ruff"]

[project.scripts]
polaroam = "polaroam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polaroam = ["data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
